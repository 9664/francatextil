name: Build cPanel package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare static export
        run: rm -rf app/noticias

      - name: Build static site
        run: npm run build

      - name: Package public_html
        run: |
          cd out
          zip -r ../francatextil-public_html.zip .

      - name: Upload cPanel artifact
        uses: actions/upload-artifact@v4
        with:
          name: francatextil-public_html
          path: francatextil-public_html.zip
          retention-days: 14
